name: transitops_gis
description: TransitOps GIS — transportation and field operations demo for Flutter + ArcGIS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  equatable: ^2.0.7
  dio: ^5.9.0

  # 200.8 is the latest Esri SDK certified/compatible with Flutter 3.35.x.
  # 300.1 requires Flutter 3.44+ / Dart 3.12+.
  arcgis_maps: 200.8.0+4672

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
